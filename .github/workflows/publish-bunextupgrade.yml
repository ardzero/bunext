name: Publish bunextupgrade

# Two jobs so dependency code never runs with publish rights:
# - build: no secrets, no OIDC. Frozen install with install scripts off, build,
#   version check, and pack the tarball to publish.
# - publish: only when the version is new. Runs in the `npm` environment (needs
#   your approval, main only) and publishes the packed tarball with npm
#   trusted publishing. It checks out no code and installs nothing.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "packages/bunextupgrade/**"

permissions:
  contents: read

jobs:
  build:
    name: Build bunextupgrade
    # Releases only come from main, including manual runs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version_check.outputs.publish }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install bunextupgrade dependencies
        working-directory: packages/bunextupgrade
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check version
        id: version_check
        working-directory: packages/bunextupgrade
        run: |
          PKG_NAME=$(bun -p "require('./package.json').name")
          PKG_VERSION=$(bun -p "require('./package.json').version")

          PUBLISHED=$(bun pm view "$PKG_NAME@$PKG_VERSION" version 2>/dev/null || echo "")
          if [ "$PUBLISHED" = "$PKG_VERSION" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and pack bunextupgrade
        if: steps.version_check.outputs.publish == 'true'
        working-directory: packages/bunextupgrade
        run: |
          bun run build
          bun pm pack --ignore-scripts --destination "$RUNNER_TEMP/package"

      - name: Upload packed tarball
        if: steps.version_check.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish bunextupgrade
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write

    steps:
      - name: Download packed tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package

      # npm is only needed for `npm publish --provenance` (trusted publishing
      # via OIDC), which `bun publish` doesn't support. Node 26's bundled npm
      # (11.x) does.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Publish bunextupgrade
        run: npm publish "$RUNNER_TEMP"/package/bunextupgrade-*.tgz --provenance --access public --ignore-scripts
