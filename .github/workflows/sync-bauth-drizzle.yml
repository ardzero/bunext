name: Sync auth template

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Publish npm packages]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-bauth-drizzle
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge main into auth template
        id: merge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const base = "bauth-drizzle";
            const head = "main";
            const { data: mainCommit } = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: head,
            });
            const commitTitle = mainCommit.commit.message.split(/\r?\n/, 1)[0];
            core.setOutput("main_sha", mainCommit.sha);
            core.setOutput("commit_title", commitTitle);

            try {
              await github.rest.repos.merge({
                owner,
                repo,
                base,
                head: mainCommit.sha,
                commit_message: `chore: sync main into bauth-drizzle: ${commitTitle}`,
              });
              core.info("Auth template is up to date with main.");
              core.setOutput("outcome", "merged");
            } catch (error) {
              if (error.status !== 409) throw error;

              core.info("Merge conflicts with main; resolving in the next steps.");
              // not "result": github-script overwrites that output with the
              // script's return value, which would skip the conflict steps
              core.setOutput("outcome", "conflict");
            }

      # Conflicts limited to package.json/bun.lock (e.g. a Renovate bump next
      # to an auth-only dependency) are resolved here; anything else, or the
      # same value changed on both sides, falls through to a tracking issue.
      - name: Checkout auth template
        if: steps.merge.outputs.outcome == 'conflict'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: bauth-drizzle
          fetch-depth: 0

      - name: Setup Bun
        if: steps.merge.outputs.outcome == 'conflict'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Resolve dependency-only conflicts
        id: resolve
        if: steps.merge.outputs.outcome == 'conflict'
        continue-on-error: true
        env:
          MAIN_SHA: ${{ steps.merge.outputs.main_sha }}
          COMMIT_TITLE: ${{ steps.merge.outputs.commit_title }}
        run: |
          set -euo pipefail
          resolved=false
          echo "reason=Automatic resolution did not complete; inspect the run logs." >> "$GITHUB_OUTPUT"
          trap 'echo "resolved=$resolved" >> "$GITHUB_OUTPUT"' EXIT

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # the merge script lives on main; bauth-drizzle may hold an older copy
          merge_script="$RUNNER_TEMP/merge-package-json.ts"
          git show "$MAIN_SHA:.github/scripts/merge-package-json.ts" > "$merge_script"

          if git merge --no-ff -m "chore: sync main into bauth-drizzle: $COMMIT_TITLE" "$MAIN_SHA"; then
            echo "reason=The resolved merge could not be pushed to bauth-drizzle (possibly workflow-file token restrictions)." >> "$GITHUB_OUTPUT"
            git push origin HEAD:bauth-drizzle
            resolved=true
            exit 0
          fi

          conflicts=$(git diff --name-only --diff-filter=U)
          { echo "conflicts<<CONFLICT_FILES"; echo "$conflicts"; echo "CONFLICT_FILES"; } >> "$GITHUB_OUTPUT"
          echo "reason=Merge conflicts need manual resolution." >> "$GITHUB_OUTPUT"
          echo "Conflicted files:"
          echo "$conflicts"
          for file in $conflicts; do
            if [ "$file" != "package.json" ] && [ "$file" != "bun.lock" ]; then
              echo "::notice::$file needs a manual resolution"
              git merge --abort
              exit 0
            fi
          done

          if grep -qx "package.json" <<< "$conflicts"; then
            git show :1:package.json > "$RUNNER_TEMP/base.json"
            git show :2:package.json > "$RUNNER_TEMP/ours.json"
            git show :3:package.json > "$RUNNER_TEMP/theirs.json"
            # run from RUNNER_TEMP so bun doesn't read the conflicted package.json
            if ! bun --cwd "$RUNNER_TEMP" "$merge_script" "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/ours.json" "$RUNNER_TEMP/theirs.json" "$PWD/package.json"; then
              git merge --abort
              exit 0
            fi
          fi

          # regenerate the lockfile from the merged package.json, starting
          # from bauth-drizzle's copy so its auth/db packages keep their versions
          if grep -qx "bun.lock" <<< "$conflicts"; then
            git checkout --ours -- bun.lock
          fi
          bun install --lockfile-only --ignore-scripts

          git add package.json bun.lock
          git commit --no-edit
          echo "reason=The resolved merge could not be pushed to bauth-drizzle (possibly workflow-file token restrictions)." >> "$GITHUB_OUTPUT"
          git push origin HEAD:bauth-drizzle
          resolved=true
          echo "::notice::Resolved dependency-only sync conflicts automatically"

      - name: Track manual resolution or close the tracking issue
        if: always() && (steps.merge.outputs.outcome == 'merged' || steps.merge.outputs.outcome == 'conflict')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MAIN_SHA: ${{ steps.merge.outputs.main_sha }}
          MERGE_OUTCOME: ${{ steps.merge.outputs.outcome }}
          RESOLVED: ${{ steps.resolve.outputs.resolved }}
          REASON: ${{ steps.resolve.outputs.reason }}
          CONFLICTS: ${{ steps.resolve.outputs.conflicts }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = "Sync main into bauth-drizzle needs manual resolution";
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100,
            });
            const tracking = issues.filter(issue => !issue.pull_request && issue.title === title);
            if (process.env.MERGE_OUTCOME === "merged" || process.env.RESOLVED === "true") {
              for (const issue of tracking) {
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed" });
              }
              return;
            }

            const syncBranch = "sync/main-into-bauth-drizzle";
            let compareHead = "main";
            let branchNote = "";
            try {
              const { data: pulls } = await github.rest.pulls.list({
                owner, repo, head: `${owner}:${syncBranch}`, state: "open",
              });
              if (pulls.length) {
                compareHead = syncBranch;
                branchNote = `Preserved resolution work in ${pulls[0].html_url}.`;
              } else {
                // Delete and recreate only the reserved automation branch.
                // Never reset a branch with commits not yet in main or the template.
                let exists = true;
                try {
                  await github.rest.git.getRef({ owner, repo, ref: `heads/${syncBranch}` });
                } catch (error) {
                  if (error.status !== 404) throw error;
                  exists = false;
                }
                if (exists) {
                  const comparisons = await Promise.all(["main", "bauth-drizzle"].map(base =>
                    github.rest.repos.compareCommits({ owner, repo, base, head: syncBranch })
                  ));
                  if (comparisons.every(({ data }) => data.ahead_by > 0)) {
                    throw new Error("Reserved branch has unmerged commits; preserving it for owner review");
                  }
                  await github.rest.git.deleteRef({ owner, repo, ref: `heads/${syncBranch}` });
                }
                await github.rest.git.createRef({
                  owner, repo, ref: `refs/heads/${syncBranch}`, sha: process.env.MAIN_SHA,
                });
                compareHead = syncBranch;
              }
            } catch (error) {
              branchNote = `Could not refresh the reserved branch: ${error.message}. Compare main directly.`;
              core.warning(branchNote);
            }
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              process.env.REASON || "Automatic synchronization requires manual resolution.",
              process.env.CONFLICTS ? `Conflicting files:\n\n\`\`\`text\n${process.env.CONFLICTS}\n\`\`\`` : "Conflicting files were not available; inspect the run logs.",
              branchNote,
              `[Open the compare page and create a PR](https://github.com/${owner}/${repo}/compare/bauth-drizzle...${compareHead}?expand=1).`,
              "Resolve on the sync branch and merge into bauth-drizzle. Keep main unchanged.",
              `[Workflow run](${run})`,
            ].filter(Boolean).join("\n\n");
            if (tracking.length) {
              await github.rest.issues.update({ owner, repo, issue_number: tracking[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
            core.setFailed("Sync needs manual resolution. See the tracking issue.");
