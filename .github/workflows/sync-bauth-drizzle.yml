name: Sync auth template

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Publish npm packages]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-bauth-drizzle
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge main into auth template
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const base = "bauth-drizzle";
            const head = "main";
            const syncBranch = "sync/main-into-bauth-drizzle";
            const { data: mainCommit } = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: head,
            });
            const commitTitle = mainCommit.commit.message.split(/\r?\n/, 1)[0];

            try {
              await github.rest.repos.merge({
                owner,
                repo,
                base,
                head: mainCommit.sha,
                commit_message: `chore: sync main into bauth-drizzle: ${commitTitle}`,
              });
              core.info("Auth template is up to date with main.");
            } catch (error) {
              if (error.status !== 409) throw error;

              const { data: existing } = await github.rest.pulls.list({
                owner,
                repo,
                base,
                head: `${owner}:${syncBranch}`,
                state: "open",
              });
              if (existing.length > 0) {
                core.warning(`Resolve sync conflicts in ${existing[0].html_url}`);
                return;
              }

              // Only refresh the reserved sync branch when no PR is open.
              // Preserve any in-progress conflict resolutions on an open PR.
              try {
                await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `heads/${syncBranch}`,
                });
                await github.rest.git.updateRef({
                  owner,
                  repo,
                  ref: `heads/${syncBranch}`,
                  sha: mainCommit.sha,
                  force: true,
                });
              } catch (refError) {
                if (refError.status !== 404) throw refError;
                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: `refs/heads/${syncBranch}`,
                  sha: mainCommit.sha,
                });
              }

              const { data: pull } = await github.rest.pulls.create({
                owner,
                repo,
                base,
                head: syncBranch,
                title: "chore: resolve main sync into bauth-drizzle",
                body: "Automatic synchronization encountered merge conflicts. Resolve the conflicts on this dedicated sync branch and merge this PR into bauth-drizzle. Keep main unchanged. Further main updates will be picked up by the next sync after this PR is merged.",
              });
              core.warning(`Resolve sync conflicts in ${pull.html_url}`);
            }
